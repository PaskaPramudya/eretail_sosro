<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - E-Commerce Sosro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-amber-900 via-amber-800 to-red-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header Frame -->
        <div class="bg-amber-800 text-white p-6 text-center">
            <div class="inline-flex items-center gap-2 bg-red-600 px-3 py-1 rounded-lg font-bold text-lg mb-2">
                <i data-lucide="store" class="w-5 h-5"></i> SOSRO
            </div>
            <h2 class="text-xl font-bold">Buat Akun Baru</h2>
            <p class="text-xs text-amber-200 mt-1">Daftar untuk menikmati kemudahan pemesanan grosir & eceran</p>
        </div>

        <!-- Tab Navigasi -->
        <div class="flex border-b border-gray-200 bg-gray-50 text-sm font-semibold">
            <a href="login.html" class="w-1/2 text-center py-3 text-gray-500 hover:text-amber-800">Masuk</a>
            <a href="daftar.html" class="w-1/2 text-center py-3 text-amber-800 border-b-2 border-amber-800 bg-white">Daftar Akun</a>
        </div>

        <!-- Form Register -->
        <form action="proses_daftar.php" method="POST" class="p-6 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Lengkap / Nama Toko</label>
                <input type="text" name="nama_lengkap" placeholder="Contoh: Toko Berkah Sosro" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat Email</label>
                <input type="email" name="email" placeholder="nama@email.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">No. WhatsApp / Handphone</label>
                <input type="tel" name="no_hp" placeholder="08123456789" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Buat Kata Sandi</label>
                <input type="password" name="password" placeholder="Minimal 6 karakter" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition shadow text-sm mt-2">
                Daftar Akun Sekarang
            </button>

            <div class="text-center pt-2">
                <a href="pelanggan.html" class="text-xs text-gray-500 hover:text-amber-800 inline-flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Kembali ke Katalog Produk
                </a>
            </div>
        </form>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
