    <!-- SCRIPT LOGIKA TABS & NOTIFIKASI -->
    <script>
        const panel = {
            masuk: document.getElementById('formMasuk'),
            daftar: document.getElementById('formDaftar'),
            admin: document.getElementById('formAdmin')
        };

        const tab = {
            masuk: document.getElementById('tabMasuk'),
            daftar: document.getElementById('tabDaftar'),
            admin: document.getElementById('tabAdmin')
        };

        function gantiTab(pilihan) {
            Object.keys(panel).forEach(function (nama) {
                panel[nama].classList.toggle('hidden', nama !== pilihan);

                const isMatch = nama === pilihan;
                if(isMatch) {
                    tab[nama].className = "flex-1 py-2 text-sm font-bold bg-white text-slate-900 rounded-lg shadow-sm transition-all";
                } else {
                    tab[nama].className = "flex-1 py-2 text-sm font-semibold text-slate-500 hover:text-slate-900 hover:bg-slate-200/50 rounded-lg transition-all";
                }
            });

            const judul = document.getElementById('judulHalaman');
            const deskripsi = document.getElementById('deskripsiHalaman');

            if (pilihan === 'masuk') {
                judul.textContent = 'Selamat Datang';
                deskripsi.textContent = 'Masuk ke akun Sosro Official Store Anda';
            } else if (pilihan === 'daftar') {
                judul.textContent = 'Buat Akun Baru';
                deskripsi.textContent = 'Daftar untuk berbelanja di Sosro Official Store';
            } else {
                judul.textContent = 'Login Administrator';
                deskripsi.textContent = 'Masuk untuk mengelola produk Sosro';
            }

            document.getElementById('notifikasi').classList.add('hidden');
        }

        const parameter = new URLSearchParams(window.location.search);
        const notifikasi = document.getElementById('notifikasi');

        if (parameter.has('error')) {
            notifikasi.textContent = 'Login gagal. Periksa kembali data Anda.';
            notifikasi.className = 'mx-8 mt-4 rounded-xl p-3 text-sm font-semibold bg-red-50 text-red-600 border border-red-100 flex items-center gap-2';
            notifikasi.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4"></i> ${notifikasi.textContent}`;
            
            if (parameter.get('jenis') === 'admin') {
                gantiTab('admin');
            } else {
                gantiTab('masuk');
            }
        } else if (parameter.has('register_success')) {
            notifikasi.textContent = 'Pendaftaran berhasil. Silakan masuk.';
            notifikasi.className = 'mx-8 mt-4 rounded-xl p-3 text-sm font-semibold bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center gap-2';
            notifikasi.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> ${notifikasi.textContent}`;
            gantiTab('masuk');
        }

        lucide.createIcons();
    </script>
