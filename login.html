<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - E-Commerce Sosro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-amber-900 via-amber-800 to-red-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header Frame -->
        <div class="bg-amber-800 text-white p-6 text-center">
            <div class="inline-flex items-center gap-2 bg-red-600 px-3 py-1 rounded-lg font-bold text-lg mb-2">
                <i data-lucide="store" class="w-5 h-5"></i> SOSRO
            </div>
            <h2 class="text-xl font-bold">Selamat Datang Kembali</h2>
            <p class="text-xs text-amber-200 mt-1">Masuk ke akun Sosro Official Store Anda</p>
        </div>

        <!-- Tab Navigasi -->
        <div class="flex border-b border-gray-200 bg-gray-50 text-sm font-semibold">
            <a href="login.html" class="w-1/2 text-center py-3 text-amber-800 border-b-2 border-amber-800 bg-white">Masuk</a>
            <a href="daftar.html" class="w-1/2 text-center py-3 text-gray-500 hover:text-amber-800">Daftar Akun</a>
        </div>

        <!-- Form Login -->
        <form action="proses_login.php" method="POST" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email / No. Handphone.</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" name="email_or_phone" placeholder="Contoh: ahmad@gmail.com" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Kata Sandi (Password)</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" name="password" placeholder="••••••••" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center text-gray-600 cursor-pointer">
                    <input type="checkbox" class="rounded border-gray-300 text-amber-800 focus:ring-amber-500 mr-2"> Ingat Saya
                </label>
                <a href="#" class="text-amber-800 hover:underline font-medium">Lupa Password?</a>
            </div>

            <button type="submit" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-2.5 rounded-lg transition shadow text-sm">
                Masuk Sekarang
            </button>

            <div class="text-center pt-2">
                <a href="pelanggan.html" class="text-xs text-gray-500 hover:text-amber-800 inline-flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Kembali ke Katalog Produk
                </a>
            </div>
        </form>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
